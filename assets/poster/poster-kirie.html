<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ポスター — 運命、賄賂で買いませんか？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* A4 縦。1240×1754 のCSSピクセルで組み、2倍で描くと 300dpi 相当 */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #fefefc; --ink: #1c1a1b; --muted: #6b6466; --red: #9f1111; --hot: #e0352b; --plum: #663661; --lilac: #d9b8dc; --sky: #bcdce8;
    --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", serif; --gothic: "Noto Sans JP", "Hiragino Sans", sans-serif;
  }
  html, body { background: #888; }
  .poster { position: relative; width: 1240px; height: 1754px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--gothic); margin: 0 auto; }
  @media print { html, body { background: none; } .poster { margin: 0; } @page { size: A4 portrait; margin: 0; } }

  /* 背景：紙のにじみと、ごく薄い繊維 */
  .bg { position: absolute; inset: 0; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .b1 { width: 900px; height: 900px; left: -320px; top: -260px; background: var(--sky); opacity: 0.55; }
  .b2 { width: 760px; height: 760px; right: -300px; top: 420px; background: var(--lilac); opacity: 0.5; }
  .b3 { width: 700px; height: 700px; left: 120px; bottom: -380px; background: #a7709f; opacity: 0.18; }
  .grain { position: absolute; inset: 0; opacity: 0.35; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.45 0 0 0 0 0.47 0 0 0 0.06 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  .frame { position: absolute; inset: 34px; border: 1.5px solid rgba(28, 26, 27, 0.22); pointer-events: none; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 26px; height: 26px; border: 1.5px solid var(--red); }
  .frame::before { left: -1.5px; top: -1.5px; border-right: 0; border-bottom: 0; }
  .frame::after { right: -1.5px; bottom: -1.5px; border-left: 0; border-top: 0; }

  /* 上：学校・収穫祭 */
  .eyebrow { position: absolute; left: 0; right: 0; top: 72px; text-align: center; font-size: 19px; font-weight: 700; letter-spacing: 0.42em; color: var(--muted); }
  .eyebrow b { color: var(--red); font-weight: 700; }

  /* 題：ロゴの文字レイヤー（1000px の正方形の下のほうに文字がある） */
  .title { position: absolute; left: 90px; width: 1060px; top: 112px; height: 320px; overflow: hidden; }
  .title img { position: absolute; left: 0; width: 1060px; top: -725px; }

  /* 水晶玉と手 */
  .mark { position: absolute; left: 140px; top: 445px; width: 960px; height: 960px; }
  .mark img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mark .hand { transform: translate(4px, -6px) rotate(-3deg); }
  .mark::after { content: ""; position: absolute; left: 110px; right: 110px; bottom: 28px; height: 70px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(60, 30, 55, 0.22), transparent 70%); z-index: -1; filter: blur(8px); }

  /* 呼びかけの一文 */
  .lead { position: absolute; left: 0; right: 0; top: 1178px; text-align: center; font-family: var(--mincho); font-weight: 800; font-size: 42px; line-height: 1.45; letter-spacing: 0.06em; }
  .lead .hl { color: var(--red); }
  .lead .u { background: linear-gradient(transparent 62%, rgba(217, 184, 220, 0.9) 62%); }

  /* 遊び方 三段 */
  .steps { position: absolute; left: 90px; right: 90px; top: 1352px; display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 14px; }
  .step { text-align: center; }
  .step .n { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--paper); font-family: var(--mincho); font-weight: 800; font-size: 20px; margin-bottom: 8px; }
  .step .t { font-family: var(--mincho); font-weight: 800; font-size: 27px; letter-spacing: 0.04em; }
  .step .s { font-size: 16px; color: var(--muted); margin-top: 4px; font-weight: 500; }
  .step .t em { font-style: normal; color: var(--red); }
  .arrow { font-family: var(--mincho); font-size: 30px; color: var(--muted); }

  /* 位の印 */
  .seals { position: absolute; left: 0; right: 0; top: 1486px; display: flex; justify-content: center; align-items: center; gap: 18px; }
  .seals .l { font-size: 15px; font-weight: 700; letter-spacing: 0.2em; color: var(--muted); margin-right: 8px; }
  .seal { display: inline-grid; place-items: center; width: 52px; height: 52px; border: 2.5px solid var(--red); border-radius: 5px; color: var(--red); font-family: var(--mincho); font-weight: 800; font-size: 24px; transform: rotate(-6deg); }
  .seal.mu { border-color: #a29b9e; color: #a29b9e; }
  .seal.kz { background: var(--ink); border-color: var(--hot); color: var(--hot); font-size: 15px; line-height: 1.05; text-align: center; width: 60px; height: 60px; transform: rotate(5deg); }
  .seals .amt { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 4px; text-align: center; }
  .seals .c { display: grid; justify-items: center; }

  /* 下：場所と QR */
  .foot { position: absolute; left: 60px; right: 60px; bottom: 48px; height: 118px; display: grid; grid-template-columns: 1fr auto auto; gap: 26px; align-items: stretch; }
  .place { background: var(--ink); color: #f4efe6; border-radius: 18px; padding: 12px 26px; display: flex; align-items: center; gap: 22px; }
  .place .k { font-size: 15px; font-weight: 700; letter-spacing: 0.3em; color: var(--lilac); writing-mode: vertical-rl; }
  .place .v { font-family: var(--mincho); font-weight: 800; font-size: 46px; letter-spacing: 0.06em; line-height: 1; white-space: nowrap; }
  .place .v small { display: block; font-family: var(--gothic); font-size: 16px; font-weight: 500; letter-spacing: 0.12em; color: #c9c0c3; margin-top: 10px; }
  .qr { display: grid; grid-template-columns: 100px auto; gap: 12px; align-items: center; padding: 8px 14px 8px 8px; border-radius: 18px; background: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 18px 40px -24px rgba(60,30,55,0.4); }
  .qr svg { width: 100px; height: 100px; display: block; }
  .qr .cap { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); line-height: 1.5; }
  .qr .cap b { display: block; font-family: var(--mincho); font-size: 17px; color: var(--ink); letter-spacing: 0; white-space: nowrap; }
</style>
</head>
<body>
<div class="poster">
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grain"></div></div>
  <div class="frame"></div>

  <p class="eyebrow">慶應義塾志木高等学校　<b>収穫祭 2026</b>　2年C組</p>

  <div class="title"><img src="../layer-copy.webp" alt="運命、賄賂で買いませんか？"></div>

  <div class="mark">
    <img class="ball" src="../layer-ball.webp" alt="">
    <img class="hand" src="../layer-hand.webp" alt="">
  </div>

  <p class="lead">ミニゲームで<span class="hl">賄賂</span>を稼いで、占い師を買収し、<br><span class="u">未来を、ねじ曲げろ。</span></p>

  <div class="steps">
    <div class="step"><span class="n">1</span><p class="t">ミニゲーム</p><p class="s">遊んで「縁（えん）」を増やす</p></div>
    <span class="arrow">→</span>
    <div class="step"><span class="n">2</span><p class="t">占い師に<em>心付け</em></p><p class="s">額は自由。渡すほど、態度が変わる</p></div>
    <span class="arrow">→</span>
    <div class="step"><span class="n">3</span><p class="t">神託を受ける</p><p class="s">結果はスマホに届く。シェアしよう</p></div>
  </div>

  <div class="seals">
    <span class="l">心付けの位</span>
    <div class="c"><span class="seal mu">無</span><span class="amt">0〜</span></div>
    <div class="c"><span class="seal">小</span><span class="amt">100〜</span></div>
    <div class="c"><span class="seal">大</span><span class="amt">500〜</span></div>
    <div class="c"><span class="seal kz">改<br>竄</span><span class="amt">2,000〜 神託を書き換える</span></div>
  </div>

  <div class="foot">
    <div class="place"><span class="k">場所</span><p class="v">HR棟 3F　2C<small>収穫祭 2026　2年C組</small></p></div>
    <div class="qr"><div id="qr-hp"></div><p class="cap">公式サイト<b>moneytalks-uranai.com</b>遊び方・番付</p></div>
    <div class="qr"><div id="qr-ig"></div><p class="cap">Instagram<b>@keioshiki2c79</b>最新情報</p></div>
  </div>
</div>
<script src="../../app/public/vendor/qrcode.js"></script>
<script>
  function qr(id, text) { var q = qrcode(0, 'M'); q.addData(text); q.make(); document.getElementById(id).innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
  qr('qr-hp', 'https://moneytalks-uranai.com/');
  qr('qr-ig', 'https://www.instagram.com/keioshiki2c79/');
</script>
</body>
</html>
