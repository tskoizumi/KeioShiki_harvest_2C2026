<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ポスター — 運命、賄賂で買いませんか？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* 友達の元デザインを土台に：市松の背景・水色の水晶玉・黄緑のラインの一文・手書き風の題。
     A4 縦。1240×1754 のCSSピクセルで組み、2倍で描くと 300dpi 相当 */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #f4e9d4; --black: #3b3a3c; --red: #a3383c; --ink: #1a1819;
    --cyan: #3ee6f2; --cyan2: #0fc9dc; --purple: #8a3cc4; --violet: #c48bdc; --lime: #c6f243; --hot: #ff2a2a;
    --hand: "Yusei Magic", "Hiragino Sans", sans-serif; --display: "Dela Gothic One", "Yusei Magic", sans-serif; --gothic: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  }
  html, body { background: #888; }
  .poster { position: relative; width: 1240px; height: 1754px; overflow: hidden; background: var(--cream); color: var(--ink); font-family: var(--gothic); margin: 0 auto; }
  @media print { html, body { background: none; } .poster { margin: 0; } @page { size: A4 portrait; margin: 0; } }

  /* 背景：ひし形の市松（黒と赤をクリームで区切る）。上と下に薄い帯を置いて文字を読ませる */
  .bg { position: absolute; inset: 0; }
  .bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wash { position: absolute; left: 0; right: 0; }
  .wash.top { top: 0; height: 600px; background: linear-gradient(180deg, rgba(246, 237, 220, 0.9) 0%, rgba(246, 237, 220, 0.86) 55%, rgba(246, 237, 220, 0) 100%); }
  .wash.mid { top: 1130px; height: 360px; background: linear-gradient(180deg, rgba(246, 237, 220, 0) 0%, rgba(246, 237, 220, 0.9) 28%, rgba(246, 237, 220, 0.9) 72%, rgba(246, 237, 220, 0) 100%); }
  .wash.foot { bottom: 0; height: 250px; background: linear-gradient(0deg, rgba(246, 237, 220, 0.94) 0%, rgba(246, 237, 220, 0.8) 70%, rgba(246, 237, 220, 0) 100%); }

  /* 題：手書き風。白いふちで背景から浮かせる */
  .title { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-family: var(--hand); font-size: 118px; line-height: 1.18; letter-spacing: 0.02em; color: var(--ink);
    paint-order: stroke fill; -webkit-text-stroke: 10px #fffaf0; text-shadow: 0 6px 0 rgba(255, 250, 240, 0.9), 0 10px 24px rgba(40, 20, 20, 0.25); }
  .title .w { display: block; }
  .title .bribe { display: inline-block; font-family: var(--hand); font-size: 214px; line-height: 1; color: var(--violet); -webkit-text-stroke: 18px var(--hot); paint-order: stroke fill; letter-spacing: 0; vertical-align: -0.06em; margin: 0 4px; transform: rotate(-3deg); text-shadow: 0 10px 0 #8a0f0f, 0 20px 30px rgba(120, 0, 0, 0.35); }
  .title .q { display: inline-block; transform: rotate(6deg); }

  /* 水晶玉 */
  .ball { position: absolute; left: 330px; top: 628px; width: 580px; height: 560px; isolation: isolate; }
  .ball .glass { position: absolute; left: 50px; top: 0; width: 480px; height: 480px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #c8fbff 0%, #6eeefb 24%, var(--cyan) 50%, var(--cyan2) 82%, #089fb0 100%);
    box-shadow: inset -24px -30px 60px rgba(0, 120, 140, 0.35), inset 14px 18px 40px rgba(255, 255, 255, 0.55), 0 40px 60px -30px rgba(0, 60, 80, 0.55); border: 6px solid #fffaf0; }
  .ball .hl1 { position: absolute; left: 118px; top: 58px; width: 150px; height: 70px; border-radius: 50%; background: #fff; transform: rotate(-32deg); opacity: 0.95; }
  .ball .hl2 { position: absolute; left: 150px; top: 44px; width: 36px; height: 36px; border-radius: 50%; background: #fff; }
  .ball .hl3 { position: absolute; left: 400px; top: 300px; width: 70px; height: 34px; border-radius: 50%; background: #fff; opacity: 0.55; transform: rotate(-28deg); }
  .ball .base { position: absolute; left: 0; top: 400px; width: 580px; height: 170px; border-radius: 50%; background: radial-gradient(ellipse at 50% 30%, #a564d8, var(--purple) 70%); border: 6px solid #fffaf0; box-shadow: 0 30px 50px -20px rgba(60, 0, 90, 0.5); z-index: -1; }
  .ball .base::after { content: ""; position: absolute; left: 60px; right: 60px; top: 18px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); }

  /* 一文：黄緑のラインの上に手書き */
  .lead { position: absolute; left: 0; right: 0; top: 1212px; text-align: center; font-family: var(--hand); font-size: 50px; line-height: 1.75; color: var(--ink); letter-spacing: 0.02em; }
  .lead span { display: inline; padding: 0 10px; background: linear-gradient(transparent 58%, var(--lime) 58%, var(--lime) 92%, transparent 92%); -webkit-box-decoration-break: clone; box-decoration-break: clone;
    paint-order: stroke fill; -webkit-text-stroke: 5px #fffaf0; }
  .lead b { font-weight: inherit; color: var(--red); }

  /* 遊び方（元にはない。小さく） */
  .steps { position: absolute; left: 90px; right: 90px; top: 1392px; display: flex; justify-content: center; gap: 22px; font-family: var(--gothic); font-weight: 700; font-size: 20px; color: var(--ink); }
  .steps span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 999px; background: #fffaf0; border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  .steps i { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-style: normal; font-size: 15px; font-family: var(--display); }

  /* 下：QR・Instagram・場所 */
  .foot { position: absolute; left: 70px; right: 70px; bottom: 64px; display: grid; grid-template-columns: auto auto 1fr; gap: 26px; align-items: end; }
  .qr { display: grid; justify-items: center; gap: 8px; }
  .qr .box { width: 190px; height: 190px; padding: 12px; background: #fff; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
  .qr .box svg { width: 100%; height: 100%; display: block; }
  .qr .box.ig { border-color: transparent; background: linear-gradient(#fff, #fff) padding-box, linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7) border-box; border-width: 5px; box-shadow: 6px 6px 0 #6228d7; }
  .qr .cap { font-family: var(--hand); font-size: 22px; letter-spacing: 0.08em; }
  .qr .cap.ig { font-family: var(--gothic); font-weight: 900; font-size: 18px; letter-spacing: 0.06em; background: linear-gradient(45deg, #ee2a7b, #6228d7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .place { justify-self: end; border: 4px double var(--ink); background: rgba(255, 250, 240, 0.92); padding: 22px 36px 26px; text-align: center; box-shadow: 8px 8px 0 var(--ink); }
  .place .k { font-family: var(--hand); font-size: 30px; letter-spacing: 0.1em; }
  .place .v { font-family: var(--display); font-size: 72px; line-height: 1.1; letter-spacing: 0.04em; margin-top: 4px; white-space: nowrap; }
  .place .s { font-family: var(--gothic); font-weight: 700; font-size: 17px; letter-spacing: 0.2em; color: #5a5558; margin-top: 8px; }
</style>
</head>
<body>
<div class="poster">
  <div class="bg">
    <svg viewBox="0 0 1240 1754" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <pattern id="checks" width="280" height="280" patternUnits="userSpaceOnUse" patternTransform="rotate(45) translate(40 20)">
          <rect width="280" height="280" fill="#f4e9d4"/>
          <rect x="0" y="0" width="140" height="140" fill="#3b3a3c"/>
          <rect x="140" y="140" width="140" height="140" fill="#a3383c"/>
        </pattern>
        <filter id="worn" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="7" result="n"/>
          <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.92  0 0 0 0 0.83  0 0 0 0.55 -0.12" result="wash"/>
          <feComposite in="wash" in2="SourceGraphic" operator="over"/>
        </filter>
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
          <feColorMatrix values="0 0 0 0 0.2 0 0 0 0 0.15 0 0 0 0 0.15 0 0 0 0.07 0"/>
        </filter>
      </defs>
      <rect width="1240" height="1754" fill="url(#checks)"/>
      <rect width="1240" height="1754" fill="#f4e9d4" filter="url(#worn)" opacity="0.32"/>
      <rect width="1240" height="1754" filter="url(#grain)"/>
    </svg>
    <div class="wash top"></div>
    <div class="wash mid"></div>
    <div class="wash foot"></div>
  </div>

  <h1 class="title"><span class="w">運命、<span class="bribe">賄賂</span>で</span><span class="w">買いませんか<span class="q">？</span></span></h1>

  <div class="ball"><div class="base"></div><div class="glass"></div><div class="hl1"></div><div class="hl2"></div><div class="hl3"></div></div>

  <p class="lead"><span>ミニゲームで<b>賄賂</b>を稼いで占い師を</span><br><span>買収し、未来をねじ曲げろ！</span></p>

  <div class="steps"><span><i>1</i>ミニゲームで縁を稼ぐ</span><span><i>2</i>占い師に心付け</span><span><i>3</i>結果はスマホに届く</span></div>

  <div class="foot">
    <div class="qr"><div class="box" id="qr-hp"></div><p class="cap">△公式HP△</p></div>
    <div class="qr"><div class="box ig" id="qr-ig"></div><p class="cap ig">@KEIOSHIKI2C79</p></div>
    <div class="place"><p class="k">《場所》</p><p class="v">HR棟3F 2C</p><p class="s">収穫祭 2026　慶應義塾志木高等学校</p></div>
  </div>
</div>
<script src="../../app/public/vendor/qrcode.js"></script>
<script>
  function qr(id, text) { var q = qrcode(0, 'M'); q.addData(text); q.make(); document.getElementById(id).innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
  qr('qr-hp', 'https://moneytalks-uranai.com/');
  qr('qr-ig', 'https://www.instagram.com/keioshiki2c79/');
</script>
</body>
</html>
