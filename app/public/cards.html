<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>QRカードの印刷 — 運命、賄賂で買いませんか？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- フォントは後から読む（届かない回線やブラウザでも、画面が真っ白で止まらないように） -->
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet"></noscript>
  <style>
    /* ============================================================
       スマホを持っていない客に渡すQRカード。A4に名刺サイズ（91×55mm）で10枚。
       切り取って受付に置く。QRはマイページへのリンク、番号は手入力用。
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #1c1a1b; --red: #9f1111; --muted: #6b6466; --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; --gothic: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    @page { size: A4; margin: 10mm 14mm; }
    body { font-family: var(--gothic); color: var(--ink); background: #e9e7e6; }
    .bar { position: sticky; top: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; font-size: 13px; }
    .bar input, .bar button, .bar select { font: inherit; padding: 7px 12px; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
    .bar button.pri { background: var(--ink); color: #fff; border-color: var(--ink); cursor: pointer; }
    .bar .n { color: var(--muted); }
    .sheet { width: 210mm; margin: 12px auto; padding: 10mm 14mm; background: #fff; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .fuda { width: 91mm; height: 55mm; padding: 5mm 5mm 5mm 6mm; display: grid; grid-template-columns: 36mm 1fr; gap: 4mm; align-items: center; border: 0.3mm dashed #bbb; break-inside: avoid; }
    .fuda svg { width: 36mm; height: 36mm; display: block; }
    .fuda .name { font-family: var(--mincho); font-weight: 800; font-size: 10.5pt; line-height: 1.3; }
    .fuda .code { margin-top: 2mm; font-family: var(--mincho); font-weight: 800; font-size: 16pt; letter-spacing: 0.18em; }
    .fuda .how { margin-top: 2mm; font-size: 7.5pt; color: var(--muted); line-height: 1.5; }
    .fuda .how b { color: var(--red); }
    .fuda .meta { margin-top: 1.5mm; font-size: 6.5pt; color: var(--muted); letter-spacing: 0.1em; }
    @media print { body { background: #fff; } .bar { display: none; } .sheet { margin: 0; padding: 0; width: auto; } }
    .imp { max-width: 210mm; margin: 12px auto 0; padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #fff6d8; border: 1px solid #e0b84a; border-radius: 10px; font-size: 14px; }
    .imp[hidden] { display: none; }
    .imp button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
    @media print { .imp { display: none; } }
    .err { padding: 40px; text-align: center; color: var(--red); }
  </style>
</head>
<body>
<div class="bar">
  <label>印刷する枚数 <input type="number" id="n" value="30" min="1" max="500" style="width:80px"></label>
  <button class="pri" id="make" type="button">QRカードを発行する</button>
  <select id="which"><option value="unclaimed">まだ渡していないカード</option><option value="all">全部</option></select>
  <button id="print" type="button">印刷</button>
  <span class="n" id="count"></span>
  <span class="n">発行したカードは、受付で名前と紐づけるか、客が自分でQRを読んで名前を入れると使えるようになります。</span>
</div>
<div class="imp" id="imp" hidden><p id="imp-msg"></p><button class="pri" id="imp-go" type="button">登録する</button></div>
<div class="sheet"><div class="grid" id="grid"></div></div>
<p class="err" id="err" hidden></p>
<script src="/vendor/qrcode.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var site = { name: '運命、賄賂で買いませんか？', event: '収穫祭 2026', className: '2年C組' };
  function api(path, opts) { return fetch(path, opts).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); }); }

  function render(list) {
    var g = $('grid'); g.textContent = '';
    list.forEach(function (c) {
      var d = document.createElement('div'); d.className = 'fuda';
      var q = qrcode(0, 'M'); q.addData(location.origin + '/u/' + c.token); q.make();
      d.innerHTML = q.createSvgTag(2, 0) +
        '<div><p class="name">' + site.name + '</p>' +
        '<p class="code">' + c.shortCode + '</p>' +
        '<p class="how">QRを読むと<b>マイページ</b>が開きます。<br>名前を入れて、縁を受け取ってください。</p>' +
        '<p class="meta">' + site.event + '　' + site.className + (c.nickname ? '　渡し済み：' + c.nickname : '') + '</p></div>';
      g.appendChild(d);
    });
    $('count').textContent = list.length + ' 枚';
  }

  function load() {
    api('/api/staff/cards').then(function (x) {
      if (!x.ok) { $('err').hidden = false; $('err').textContent = x.d.message || '責任者以上でログインしてください（/staff）'; return; }
      var all = x.d.results;
      render($('which').value === 'all' ? all : all.filter(function (c) { return !c.nickname; }));
    });
  }
  $('make').addEventListener('click', function () {
    $('make').disabled = true;
    api('/api/staff/cards', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ n: Number($('n').value) }) })
      .then(function (x) { $('make').disabled = false; if (!x.ok) { alert(x.d.message); return; } load(); });
  });
  // 手元で作って印刷済みのカードを登録する（リンクの # のあとに「トークン.番号」がカンマ区切りで入っている）
  var m = location.hash.match(/^#add=([A-Za-z0-9_.,-]+)$/);
  if (m) {
    var cards = m[1].split(',').map(function (x) { var p = x.split('.'); return { token: p[0], shortCode: p[1] }; });
    $('imp').hidden = false;
    $('imp-msg').textContent = '印刷済みのQRカード ' + cards.length + ' 枚を登録します。登録すると、そのカードのQRが使えるようになります。';
    $('imp-go').addEventListener('click', function () {
      $('imp-go').disabled = true;
      api('/api/staff/cards/import', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cards: cards }) }).then(function (x) {
        $('imp-go').disabled = false;
        if (!x.ok) { $('imp-msg').textContent = x.d.message || '登録できませんでした'; return; }
        $('imp-msg').textContent = '登録しました：新しく ' + x.d.added + ' 枚' + (x.d.already ? '（登録済み ' + x.d.already + ' 枚）' : '') + '。同じリンクをもう一度開いても、二重には登録されません。';
        history.replaceState(null, '', location.pathname); $('imp-go').hidden = true; load();
      });
    });
  }
  $('which').addEventListener('change', load);
  $('print').addEventListener('click', function () { window.print(); });
  api('/api/staff/me').then(function (x) { if (x.ok && x.d.site) site = x.d.site; load(); });
})();
</script>
</body>
</html>
